# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Số tính bằng src/lab13.py. Số tính từ cột _simulated ghi nhãn simulated.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml', encoding='utf-8'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (statsmodels: 1.249,6).
#   b) Theo nhân viên, m = 75: DE = 2,48; 3.103 mỗi nhóm, 42 người mỗi nhóm, tổng 84 > 40: không đủ người.
#   c) 20 nhân viên mỗi nhóm: tối đa 20 / 0,02 = 1.000 < 1.251: không đạt.
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300, lại dưới 20 cụm: không đạt.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 người mỗi nhóm: ít nhất 299 yêu cầu mỗi người (DE 6,96).
#   Chọn chia theo nhân viên. Trong phạm vi có 30,7 yêu cầu/người/ngày, đủ 299 sau 9,7 ngày;
#   đo 14 ngày được 430 yêu cầu/người, cỡ mẫu hiệu dụng 898. Chỉ còn noi_dia thì 360 và 880, vẫn đủ 859.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn:
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên làm quy trình cũ cùng tuần, cùng depot.
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên bằng code, phân tầng theo depot, seed ghi trước.
#   3. Ảnh hưởng gián tiếp và cách giảm: có rủi ro chia sẻ trong depot; quyền theo tài khoản, log lượt mở theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trước 07/12/2026, quyết định 12/01/2027.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20.
#
# Đánh đổi đã chấp nhận: chỉ đủ mẫu cho mức chênh 6 điểm, không phải 5 điểm Giám đốc vận hành yêu cầu.
#   Nếu tác động thật là 5 điểm thì power chỉ 0,64. Chia theo yêu cầu đủ mẫu cho 5 điểm (1.251) nhưng cùng
#   một nhân viên vừa dùng vừa không dùng trợ lý nên tác động tràn sang đối chứng.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại: 4,25% (51/1.200); trong phạm vi 3,97% (39/982); hang_nang 8,23% (13/158).
#   Ngưỡng an toàn: hơn đối chứng từ 2 điểm hoặc vượt 6% (riêng hang_nang 12%), nên không dừng ngay vì mức hiện tại.
# Căn cứ các ngưỡng khác: làm lại trong phạm vi 4,89% (ngưỡng 7%); bỏ qua gợi ý 21,09% (ngưỡng 40%);
#   chi phí mỗi việc thành công trong phạm vi 3.414 đ simulated (ngưỡng 8.000 đ, cộng cố định 2.370 đ vẫn dưới 12.000 đ).

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang, 12 depot, 40 nhân viên CSKH; loại quoc_te (1,88× chi phí nhân viên simulated, thành công 27,3%) và doi_tac (0,85× simulated, thành công 54,4%, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
    method: "Bốc thăm bằng code, phân tầng theo depot, seed 20261207 ghi trước; hàng đợi tự chia yêu cầu, nhân viên không tự chọn"
  rollout: [0.10, 0.25, 0.50]
  schedule:
    - "0.10: 07/12-13/12/2026, 4 người dùng trợ lý, xem lại 100%"
    - "0.25: 14/12-20/12/2026, 10 người, xem lại 50% cho loại có làm lại 7 ngày không quá 7%, loại khác giữ 100%"
    - "0.50: 21/12/2026-03/01/2027, 20 người, đo chỉ số chính; xem lại theo mức đợt chạy thử (khoảng 15%), loại có làm lại trên 7% rút khỏi cả hai nhóm"
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
    min_requests_per_staff: 299
  identifiability:
    concurrent_control: "20 nhân viên đối chứng làm quy trình cũ cùng tuần, cùng depot; chỉ so yêu cầu nhận từ 21/12/2026 đến 03/01/2027, phân tích theo cụm nhân viên"
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời; mở trợ lý theo quyền tài khoản, log lượt mở theo staff_id, không chuyển tiếp gợi ý; tràn tác động làm chênh lệch đo được nhỏ đi"
    predeclared: "Chốt trước 07/12/2026: chỉ số chính, cách phân tích, luật dừng, ngày quyết định. Mở rộng chỉ khi chênh lệch từ 5 điểm trở lên và có ý nghĩa ở alpha 0,05, không luật an toàn nào bị kích, chi phí mỗi việc thành công gồm cố định dưới 12.000 đ. Ngày 21/12 xem mức nền của riêng nhóm đối chứng tuần 1: từ 94% trở lên thì dừng tại cổng"
  stop_rules:
    - "NẾU đối soát sổ cái thấy từ 1 ca hoàn trùng hoặc 1 tin 'đã hoàn' không có bản ghi sổ cái TRONG bất kỳ kỳ đối soát 1 giờ nào THÌ Kỹ sư trưởng agent tắt trợ lý trong 30 phút, chuyển toàn bộ cho nhân viên KHÔNG THÌ không được bật lại hay mở bước rollout tiếp"
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng từ 2 điểm trở lên hoặc vượt 6% TRONG 3 ngày liên tiếp (cửa sổ trượt 7 ngày) THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được mở bước rollout tiếp"
    - "NẾU tỉ lệ mở lại 7 ngày riêng hang_nang của nhóm trợ lý vượt 12% TRONG 3 ngày liên tiếp (cửa sổ trượt 7 ngày) THÌ PM trợ lý hoàn phí rút hang_nang khỏi cả hai nhóm trong 1 ngày KHÔNG THÌ không được đưa hang_nang trở lại trong đợt pilot này"
    - "NẾU chi phí mỗi việc thành công chưa gồm cố định, đo bằng phút thật, vượt 8.000 đ TRONG 7 ngày liên tiếp của bước 0.50 THÌ PM trợ lý hoàn phí đóng băng phạm vi và rà lại bảng độ nhạy trong 2 ngày làm việc KHÔNG THÌ không được giảm tỉ lệ xem lại để kéo chi phí xuống"
    - "NẾU tỉ lệ bỏ qua gợi ý (sửa hoặc bỏ) vượt 40% TRONG 7 ngày liên tiếp THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được mở bước rollout tiếp"
  interim_looks: "chỉ kiểm tra chỉ số an toàn và ngưỡng của luật dừng; không so chỉ số chính giữa hai nhóm trước ngày quyết định"
  rollback: "Người ra lệnh ở luật dừng bấm cờ tắt, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm (6 phút mỗi yêu cầu); lệnh hoàn đã gửi được đối soát sổ cái trong 24 giờ"
  decision_date: "2027-01-12"
  simulated_inputs:
